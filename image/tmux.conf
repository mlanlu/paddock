# tmux inside the sandbox exists for one reason: `paddock run` is a `docker
# exec`, so quitting the client kills the agent mid-task. Running the agent
# under tmux makes the session outlive the client, lets the desktop app
# re-attach with scrollback, and makes "open in Terminal" attach the *same*
# session instead of starting a rival one.
#
# The prefix is C-a, not the default C-b: Claude Code binds C-b for nothing but
# readline's backward-char is C-b in the shells around it, and the default
# prefix swallows it. C-a collides with start-of-line, so it is sent through on
# a double tap.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Claude Code draws its own full-width UI and repaints on resize. Without these
# it renders against the wrong width when a second client attaches.
set -g aggressive-resize on
setw -g automatic-rename off
set -g allow-rename off

# The app re-attaches to scrollback; the default 2000 lines loses a long agent
# run.
set -g history-limit 50000

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g escape-time 0
set -g status off
